name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    if: github.repository == 'Pharmaco-OmicsLab/easytableone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:api

  unit:
    if: github.repository == 'Pharmaco-OmicsLab/easytableone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p ci-reports && pnpm test:unit --reporter=json --outputFile=ci-reports/unit.json
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-unit-report
          path: ci-reports/unit.json

  pyodide:
    if: github.repository == 'Pharmaco-OmicsLab/easytableone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Reject published LFS pointers
        shell: bash
        run: |
          small=$(find public/pyodide-* -type f -name '*.whl' -size -1024c -print)
          if [ -n "$small" ]; then
            printf 'Wheel files under 1 kB (likely LFS pointers):\n%s\n' "$small" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p ci-reports && pnpm test:pyodide --reporter=json --outputFile=ci-reports/pyodide.json
      - run: pnpm test:golden
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-pyodide-report
          path: ci-reports/pyodide.json

  verify:
    if: github.repository == 'Pharmaco-OmicsLab/easytableone'
    needs: [unit, pyodide]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:projects
      - run: pnpm typecheck
      - run: pnpm build

  inventory:
    if: github.repository == 'Pharmaco-OmicsLab/easytableone'
    needs: [unit, pyodide]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: vitest-unit-report
          path: ci-reports/unit
      - uses: actions/download-artifact@v4
        with:
          name: vitest-pyodide-report
          path: ci-reports/pyodide
      - run: pnpm test:inventory
        env:
          ETO_UNIT_REPORT: ci-reports/unit/unit.json
          ETO_PYODIDE_REPORT: ci-reports/pyodide/pyodide.json
      - uses: actions/upload-artifact@v4
        with:
          name: test-inventory
          path: |
            validation/test_inventory.json
            validation/test_inventory.md

  e2e:
    if: github.repository == 'Pharmaco-OmicsLab/easytableone'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e:all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
